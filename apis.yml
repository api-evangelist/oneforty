name: Oneforty
description: Oneforty was a Twitter application marketplace and app store founded by Laura Fitton in
  2009, letting users discover, review, and purchase third-party apps and services built on the Twitter
  API. It raised roughly $1.9M (Flybridge Capital, Javelin Venture Partners, and angels including Dave
  McClure) and grew to thousands of listed apps before being acquired by HubSpot in 2011. The company is
  defunct — the oneforty.com domain now 301-redirects to hubspot.com and exposes no developer surface,
  API, documentation, or SDKs. Retained in the network as a historical portfolio-lead record only.
